[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fcagent"
version = "0.1.0"
description = "Scaffold for the FirecREST agentic orchestration layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit==4.3.0",
    "pytest==8.4.2",
    "ruff==0.12.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"firecrest-mcp/**/*.py" = ["E501", "I001"]
"hermes-plugins/telegram-mika-relay/**/*.py" = ["E501", "I001"]
"scripts/**/*.py" = ["E501", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

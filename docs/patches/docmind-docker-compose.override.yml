# Local override for the laptop demo.
#
# Kept separate from upstream's docker-compose.yml so the upstream file stays
# diffable, and so every change we make is visible in one place.
#
# Set WORKBENCH_ROOT to this repository's checkout and DUCKDB_EXT_DIR to the directory
# containing json.duckdb_extension. Docker Compose interpolates both variables in the
# bind mounts below; set them in the shell or in the .env next to the compose file.
#
# Why each change is here:
#
# 1. `ollama` gets a second network.
#    Upstream attaches ollama only to `backend`, which is declared `internal: true`.
#    An internal network has no route off the host, so the container cannot resolve
#    or reach registry.ollama.ai and `ollama pull` fails with
#      dial tcp: lookup registry.ollama.ai on 127.0.0.11:53: server misbehaving
#    That is the command prompt 04 step 2 tells you to run, so without this the
#    model can never be fetched. Adding the non-internal `frontend` network gives
#    egress while keeping `ollama` reachable at the service hostname DocMind uses.
#
# 2. Application environment is set here rather than in `.env`.
#    Upstream's app service uses an inline `environment:` block and declares no
#    `env_file`, so values in `.env` only substitute into the compose file — they
#    are never passed to the container. Anything the application must actually read
#    has to be listed here.
#
# 3. GPU acceleration is turned off; the offline flags are deliberately NOT touched.
#    This host runs CPU-only: the NVIDIA Quadro M3000M has no driver installed, so
#    upstream's default of DOCMIND_ENABLE_GPU_ACCELERATION=true would probe for a
#    GPU that cannot work.
#
#    HF_HUB_OFFLINE=1 and TRANSFORMERS_OFFLINE=1 are left exactly as the image sets
#    them. An earlier version of this override forced them to 0, on the theory that
#    they would block first-run model downloads — that was wrong. The Dockerfile
#    downloads every default retrieval model and the Docling parser bundle during
#    the build, bakes them into the image under HF_HUB_CACHE=/app/hf-models, and
#    then proves offline correctness inside the build:
#        RUN --network=none HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 python - <<'PY'
#    So nothing needs downloading at runtime, the flags are correct as they are, and
#    clearing them would let the app reach for the network against its own design.
#    The practical benefit for a live demo is that there are no surprise multi-gigabyte
#    downloads at start-up — they are all a build-time cost.
# 4. Inference budget, sized for CPU inference.
#    Four settings, each one necessary, all verified by running the retrieval path:
#
#    a. DOCMIND_LLM_REQUEST__CONTEXT_WINDOW=16384
#       DocMind defaults to 131072, which assumes a GPU. On this host the Ollama
#       model runner crashed outright on a ~8200-token prompt:
#           llama-server chat error: Post .../v1/chat/completions: EOF
#           [GIN] 500 | 3m6s | POST "/api/chat"
#       and the client saw "model runner has unexpectedly stopped". The same model
#       answered a small prompt in 6.4s, which isolated the cause to prompt size
#       rather than a broken model.
#
#    b. DOCMIND_LLM_REQUEST_TIMEOUT_SECONDS=600 AND DOCMIND_AGENTS__DECISION_TIMEOUT=1000
#       Both are required, and this is the trap: llm_factory.py computes
#           timeout_s = min(llm_request_timeout_seconds, agents.decision_timeout)
#       so raising only the first one silently does nothing. Their defaults are 120
#       and 200, giving an effective 120s. Raising the first to 600 alone yields 200s.
#       No error is reported — the request simply keeps timing out, which reads as
#       "the timeout is still too low" rather than "another setting caps it".
#
#    c. DOCMIND_LLM_REQUEST__MAX_OUTPUT_TOKENS=512
#       Bounds generation length. Answers to these questions need a few hundred
#       tokens; 2048 only adds minutes of CPU time.
#
#    d. DOCMIND_RETRIEVAL__TOP_K=3 and DOCMIND_RETRIEVAL__USE_RERANKING=false
#       The dominant cost is not generation but *prefill*: 10 chunks is ~8200 tokens
#       for the model to read before it writes a word. Three chunks cuts it to a third.
#       Reranking is disabled because it never once succeeded here — every query logged
#           WARNING reranking:_postprocess_nodes - Text rerank timeout; fail-open
#       so the cross-encoder was consuming heavy CPU against the LLM for a result the
#       system then discarded. Disabling it changes nothing about output quality,
#       because the output never contained reranked results. Measured effect of (c)+(d):
#       synthesis time fell from 613-651s (and still timing out) to 92.9s.
services:
  ollama:
    networks:
      - backend
      - frontend

  # DocMind's retrieval stack, published as an MCP server so MetaMCP can aggregate it
  # alongside firecrest-mcp (prompt 04 step 5).
  #
  # Separate service rather than a process inside `app`, for three reasons: DocMind's
  # image has no MCP package at all, so it needs a derived image anyway; the query path
  # is read-only w.r.t. the snapshot, so it does not belong in the app's writer-managed
  # process; and keeping it out of `app` means a crash in the RAG tool cannot take the
  # Streamlit UI down with it.
  #
  # It reuses the same `docmind_data` volume, so it reads exactly the snapshot the app
  # activated — including a re-ingested one, since the server re-resolves CURRENT per
  # call. The scripts are bind-mounted as individual files rather than COPY'd into the
  # image: `docker compose up -d` recreates containers, and anything baked in or copied
  # with `docker cp` goes stale exactly when you are iterating on it.
  docmind-mcp:
    image: docmind-mcp:dev
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /app/.venv/bin/python
      - /app/docmind_mcp.py
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8770"
    ports:
      - "8770:8770"
    environment:
      # LLM backend, selectable. Defaults to the local Ollama model so the stack
      # still works with no external key present (e.g. after a reboot); workbench-up.sh
      # exports DOCMIND_LLM_BACKEND_CHOICE=openai_compatible when it finds an
      # OPENROUTER_API_KEY in ~/.hermes/.env. The heavy work here is *synthesis*, and on
      # this CPU-only host the local model takes ~290s per answer, which is what makes a
      # run of several doc queries unusable. Embeddings are unaffected and stay local —
      # changing them would invalidate the ingested corpus and require a re-ingest.
      DOCMIND_LLM_BACKEND: ${DOCMIND_LLM_BACKEND_CHOICE:-ollama}
      DOCMIND_LLM_REQUEST__MODEL: ${DOCMIND_LLM_MODEL:-qwen3:4b-instruct}
      DOCMIND_OLLAMA_BASE_URL: http://ollama:11434
      # OpenRouter is OpenAI-compatible, so it rides the openai_compatible backend.
      # The key is interpolated from the environment at `docker compose` time and never
      # written into this file, which is committed.
      DOCMIND_OPENAI__BASE_URL: ${DOCMIND_OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      DOCMIND_OPENAI__API_KEY: ${DOCMIND_OPENAI_API_KEY:-}
      DOCMIND_DATABASE__QDRANT_URL: http://qdrant:6333
      DOCMIND_SECURITY__ALLOW_REMOTE_ENDPOINTS: "true"
      DOCMIND_SECURITY__ENDPOINT_ALLOWLIST: '["http://localhost","http://127.0.0.1","https://localhost","https://127.0.0.1","http://ollama","https://openrouter.ai","http://host.docker.internal"]'
      DOCMIND_ENABLE_GPU_ACCELERATION: "false"
      # Same inference budget as `app`, for the same reasons — see note 4 above.
      DOCMIND_LLM_REQUEST__CONTEXT_WINDOW: "16384"
      DOCMIND_LLM_REQUEST__MAX_OUTPUT_TOKENS: "512"
      DOCMIND_LLM_REQUEST_TIMEOUT_SECONDS: "600"
      DOCMIND_AGENTS__DECISION_TIMEOUT: "1000"
      DOCMIND_RETRIEVAL__TOP_K: "3"
      DOCMIND_RETRIEVAL__USE_RERANKING: "false"
    volumes:
      - docmind_data:/app/data
      - ${WORKBENCH_ROOT}/scripts/docmind_mcp.py:/app/docmind_mcp.py:ro
      - ${WORKBENCH_ROOT}/scripts/docmind_query.py:/app/docmind_query.py:ro
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # The base image's healthcheck probes the Streamlit UI on 8501, which this service
    # does not run — inherited unchanged, the container reports "unhealthy" while
    # serving perfectly well, and `depends_on: service_healthy` anywhere downstream
    # would then block forever. Probe the port this service actually owns.
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8770), 3).close()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - frontend
      - backend
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  app:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # See the docmind-mcp block above for why the backend is selectable and why
      # synthesis may be moved to OpenRouter while embeddings stay local.
      DOCMIND_LLM_BACKEND: ${DOCMIND_LLM_BACKEND_CHOICE:-ollama}
      DOCMIND_LLM_REQUEST__MODEL: ${DOCMIND_LLM_MODEL:-qwen3:4b-instruct}
      DOCMIND_OLLAMA_BASE_URL: http://ollama:11434

      # Inference budget for CPU-only inference. See note 4 above.
      DOCMIND_LLM_REQUEST__CONTEXT_WINDOW: "16384"
      DOCMIND_LLM_REQUEST__MAX_OUTPUT_TOKENS: "512"
      DOCMIND_LLM_REQUEST_TIMEOUT_SECONDS: "600"
      DOCMIND_AGENTS__DECISION_TIMEOUT: "1000"
      DOCMIND_RETRIEVAL__TOP_K: "3"
      DOCMIND_RETRIEVAL__USE_RERANKING: "false"

      # CPU-only host: no usable GPU driver.
      DOCMIND_ENABLE_GPU_ACCELERATION: "false"
      CUDA_VISIBLE_DEVICES: ""

      # Keep remote-endpoint policy as upstream sets it: compose service hostnames
      # resolve to private addresses and are on the allowlist explicitly. OpenRouter is
      # added for the same reason — it is an intentional external endpoint, not an
      # implicit egress.
      DOCMIND_SECURITY__ALLOW_REMOTE_ENDPOINTS: "true"
      DOCMIND_SECURITY__ENDPOINT_ALLOWLIST: '["http://localhost","http://127.0.0.1","https://localhost","https://127.0.0.1","http://ollama","https://openrouter.ai","http://host.docker.internal"]'
      # OpenRouter rides the openai_compatible backend. Key interpolated at compose time
      # from the environment, never stored in this committed file.
      DOCMIND_OPENAI__BASE_URL: ${DOCMIND_OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      DOCMIND_OPENAI__API_KEY: ${DOCMIND_OPENAI_API_KEY:-}

      DOCMIND_DATABASE__QDRANT_URL: http://qdrant:6333

    # Persist the DuckDB "json" extension across container recreations.
    # DuckDB auto-installs it on first use by downloading it from
    # extensions.duckdb.org, but that host serves only IPv6 records and the
    # Docker network is IPv4-only, so the app container cannot reach it and
    # ingestion dies with "IO Error: Failed to download extension json". The
    # extension is fetched once on the host (see scripts/fetch_duckdb_json_ext.sh)
    # and bound read-only, so a recreated container never has to fetch it again.
    # sha256: ebdced42fff071e7a9ac904347466dafb6e45c489453b0543ca6f150581fa167
    volumes:
      - ${DUCKDB_EXT_DIR}/json.duckdb_extension:/home/docmind/.duckdb/extensions/v1.3.2/linux_amd64/json.duckdb_extension:ro

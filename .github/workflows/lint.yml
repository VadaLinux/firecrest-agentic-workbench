name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Run ShellCheck 0.10.0
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/workspace:ro"
          --workdir /workspace
          koalaman/shellcheck@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
          scripts/*.sh

  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.1'
      - name: Install Ruff 0.12.12
        run: python -m pip install --disable-pip-version-check ruff==0.12.12
      - name: Run Ruff
        run: ruff check scripts firecrest-mcp --exclude .venv --exclude __pycache__

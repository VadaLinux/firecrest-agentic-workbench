name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253d73c85ef8c9c09b087a3c540c0e7c # v6.0.1
        with:
          version: "0.12.17"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253d73c85ef8c9c09b087a3c540c0e7c # v6.0.1
        with:
          version: "0.12.17"
      - run: uv sync --locked --all-groups
      - run: uv run pytest
